[project]
name = "example-project"
version = "0.1.0"
description = "An automated pipeline for periodic retrieval, aggregation, and analysis of gold price and currency exchange rate data."
readme = "README.md"
authors = [
  { name = "Daria Szpara", email = "dariaszpara2@gmal.com" }
]
requires-python = ">=3.10"

dependencies = [
  "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.15.8"
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"